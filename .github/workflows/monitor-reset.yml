name: Monitor Tibo reset posts + WeChat notify

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      post_text:
        description: 'Tibo post text (manual fallback / test)'
        required: false
        type: string
      source_url:
        description: 'Source post URL'
        required: false
        type: string
      announced_at:
        description: 'Post time in ISO 8601 (optional)'
        required: false
        type: string
      force_test_notification:
        description: 'Send a WeChat test notification'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: monitor-reset
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Snapshot previous reset state
        run: cp public/data/reset.json "$RUNNER_TEMP/reset-before.json"

      - name: Check Tibo posts
        run: npm run check-reset
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          PUBLIC_TIMELINE_RSS_URL: ${{ secrets.PUBLIC_TIMELINE_RSS_URL }}
          MANUAL_POST_TEXT: ${{ inputs.post_text }}
          MANUAL_SOURCE_URL: ${{ inputs.source_url }}
          MANUAL_ANNOUNCED_AT: ${{ inputs.announced_at }}

      - name: Sync newer status from original Reset Company
        run: node scripts/sync-upstream-reset.mjs

      - name: Send WeChat notification on new reset opportunity
        run: node scripts/notify-reset.mjs "$RUNNER_TEMP/reset-before.json" "public/data/reset.json"
        env:
          NOTIFY_TIME_ZONE: Asia/Tokyo
          FORCE_TEST_NOTIFICATION: ${{ inputs.force_test_notification }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}

      - name: Commit data changes
        run: |
          if git diff --quiet -- public/data; then
            exit 0
          fi

          git config user.name "tibo-reset-monitor"
          git config user.email "tibo-reset-monitor@users.noreply.github.com"
          git add public/data
          git commit -m "data: refresh reset schedule"
          git push
